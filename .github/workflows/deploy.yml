name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate designs
        run: npm run validate:designs

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify CORS headers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sleep 2
          # Check both GitHub Pages and custom domain (which redirects to custom domain)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L https://luongnv.com/sleek-ui/designs/editorial-dark.json)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "CORS check failed: received HTTP $HTTP_CODE"
            exit 1
          fi
          # Also verify CORS header is present
          CORS_HEADER=$(curl -s -I -L https://luongnv.com/sleek-ui/designs/editorial-dark.json | grep -i "access-control-allow-origin" || true)
          if [ -z "$CORS_HEADER" ]; then
            echo "CORS check failed: Access-Control-Allow-Origin header not found"
            exit 1
          fi
          echo "CORS check passed: design files accessible with CORS headers"

  deploy:
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@5e98f10ce206463e411e82ac66ef0f2df79c5499 # v4
